endpoint:
  base_url: http://localhost:11434/v1
  api_key: ollama
  timeout: 120
  max_retries: 2

defaults:
  model: tinyllama
  temperature: 0.6
  max_tokens: 1024

orchestration:
  debate_rounds: 1
  synthesizer_model: tinyllama
  synthesizer_temperature: 0.3
  parallel: true

# Resolved relative to this settings file's directory.
personas_dir: personas
